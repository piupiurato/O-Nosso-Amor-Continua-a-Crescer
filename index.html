<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>O Nosso Amor Continua a Crescer</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(to top right, #ffe6f0, #fff0f5);
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      overflow: hidden;
    }

    h1 {
      margin-top: 80px;
      font-size: 2.5em;
      color: #b30059;
    }

    p {
      font-size: 1.3em;
      margin: 30px 20px;
      color: #661141;
    }

    .button {
      background: #ff66a3;
      border: none;
      padding: 15px 30px;
      font-size: 1.2em;
      color: white;
      border-radius: 30px;
      cursor: pointer;
      transition: background 0.3s ease;
      margin-top: 30px;
    }

    .button:hover {
      background: #e60073;
    }

    .heart {
      position: absolute;
      width: 20px;
      height: 20px;
      background-color: #ff66a3;
      transform: rotate(45deg);
      animation: floatUp 8s linear infinite;
    }

    .heart::before,
    .heart::after {
      content: "";
      position: absolute;
      width: 20px;
      height: 20px;
      background-color: #ff66a3;
      border-radius: 50%;
    }

    .heart::before {
      top: -10px;
      left: 0;
    }

    .heart::after {
      left: -10px;
      top: 0;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) rotate(45deg);
        opacity: 1;
      }
      100% {
        transform: translateY(-120vh) rotate(45deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <h1>Cada Dia Contigo é um Novo Capítulo do Nosso Amor</h1>
  <p>Já vivemos tantas memórias, e ainda assim, mal começámos a escrever a nossa história...</p>

  <button class="button" onclick="tocarAudio()">Ouvir mensagem de amor</button>

  <p style="margin-top: 40px; font-style: italic;">Obrigado por continuares comigo. Hoje é mais um dia em que o nosso amor vence.</p>

  <audio id="audio" src="tts.mp3"></audio>

  <script>
    function tocarAudio() {
      const audio = document.getElementById('audio');
      audio.play();
    }

    // Corações flutuantes espalhados
    function criarCoração() {
      const heart = document.createElement('div');
      heart.className = 'heart';
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.top = Math.random() * 100 + 'vh';
      heart.style.animationDuration = (4 + Math.random() * 4) + 's';
      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 8000);
    }

    setInterval(criarCoração, 400);
  </script>
</body>
</html>
